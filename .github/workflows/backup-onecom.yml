# Manual job: lists the one.com SFTP folders and downloads a full backup of what is online
# (kept 90 days as a workflow artifact). Run it before a first deploy or any risky change.
name: Backup one.com

on:
  workflow_dispatch:
    inputs:
      path:
        description: Remote folder to list and back up
        default: webroots

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.ONECOM_SFTP_HOST }}
      USER: ${{ secrets.ONECOM_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
      REMOTE: ${{ inputs.path || 'webroots' }}
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List the remote folders
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            cd \"$REMOTE\"; pwd; cls -la; cls -la */; cls -la */*/ | head -n 120;
            bye" | grep -v -E '/(Images|images)/.+\.(jpe?g|png|gif)$'

      - name: Download everything
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            mirror --parallel=4 \"$REMOTE/\" backup/;
            bye"
          du -sh backup

      - uses: actions/upload-artifact@v4
        with:
          name: onecom-backup-${{ github.run_number }}
          path: backup/
          retention-days: 90
